<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AJO GIRLIE</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>')</script>
<style>
:root{--bg:#ffffff;--card:#ffffff;--line:#f3dbe5;--text:#4a2c22;--mut:#8a6b5e;--accent:#c24e84;--btn:#4a2c22;--btntext:#ffffff;--soft:#fdf1f5;--soft2:#f8dce7;--ok:#3f8f5f;--bad:#b4443f;--sh:0 4px 16px rgba(74,44,34,.07);color-scheme:light}
:root[data-theme="dark"]{--bg:#1b1210;--card:#2a1c18;--line:#4a2c33;--text:#f6e6da;--mut:#c9a99b;--accent:#f4a6c3;--btn:#f4a6c3;--btntext:#3a1f26;--soft:#3a2a24;--soft2:#4a2c33;--sh:0 4px 16px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0 0 .4rem;color:var(--accent)}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 96px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.7rem;font-weight:700;letter-spacing:.06em;color:var(--btn)}.logo span{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:14px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:16px;padding:12px}.stat b{display:block;font-size:1.25rem;color:var(--accent)}.stat small{color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;min-width:64px;border:0;background:none;color:var(--btn);font:600 .68rem Nunito;padding:6px 4px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}nav button.on{background:var(--soft2)}
.btn{background:var(--btn);color:var(--btntext);border:0;border-radius:14px;padding:10px 16px;font:700 .9rem Nunito;cursor:pointer}
.alt{background:var(--soft2);color:var(--text)}.sm{padding:6px 10px;font-size:.78rem;border-radius:10px}.red{background:var(--bad);color:#fff}.grn{background:var(--ok);color:#fff}
input,select{width:100%;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font:inherit;margin:4px 0 10px}
label{font-size:.82rem;font-weight:700;color:var(--mut)}
.bar{height:16px;background:var(--soft2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f2a9bf,#c24e84);border-radius:99px;transition:width .8s}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.72rem;font-weight:700;background:var(--soft2);color:var(--text)}
.ok{background:#d9efe0;color:#276b43}.bad{background:#f6d6d4;color:#8f2d29}.warn{background:#f8e8c4;color:#7a5412}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.84rem}td,th{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.note{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:.83rem;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut)}
.pw{display:flex;gap:8px;align-items:center}.pw input{flex:1}
.ic{background:none;border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--btn);cursor:pointer;padding:0}
.ic .sun{display:none}:root[data-theme="dark"] .ic .sun{display:inline-flex}:root[data-theme="dark"] .ic .moon{display:none}
#modal{position:fixed;inset:0;background:rgba(40,20,15,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}#modal .card{max-width:380px;width:100%}
.auth{max-width:420px;margin:4vh auto}
</style></head><body>
<div class="wrap" id="app"><p class="mut" style="text-align:center;margin-top:30vh">Loading…</p></div>
<div id="modal"><div class="card" id="mbox"></div></div>
<script>
window.READY=false;
function showErr(m){if(window.READY)return;var a=document.getElementById('app');a.textContent='';var c=document.createElement('div');c.className='card';var h=document.createElement('h2');h.textContent='Something went wrong';var p=document.createElement('p');p.textContent=String(m);var b=document.createElement('button');b.className='btn';b.textContent='Try again';b.onclick=function(){location.reload()};c.append(h,p,b);a.append(c)}
addEventListener('error',function(e){showErr(e.message)});
addEventListener('unhandledrejection',function(e){showErr(e.reason&&e.reason.message||e.reason)});
try{document.documentElement.dataset.theme=localStorage.getItem('ajo-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}
const SUPABASE_URL='https://dxzpqdjvncytcyduwvrp.supabase.co';
const SUPABASE_KEY='sb_publishable_aTjD1PL78FDznTzmBAgGyQ_mESpqQBv';
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):(showErr('Could not load the sign-in library. Please check your internet and try again.'),null);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=n=>'₦'+Math.round(+n||0).toLocaleString('en-NG');
const D=s=>s?new Date(s+'T00:00:00'):null;
let U,P,ST,PLANS=[],MEMS=[],MYSTOPS=[],PAYS=[],NOTES=[],BANK=null,PO=null,ADM={},tab='home',authMode='in';

const run=async f=>{try{await f()}catch(e){alert(e.message||String(e))}};
const q=async r=>{const {data,error}=await r;if(error)throw error;return data};
const sum=(a,f)=>a.reduce((s,x)=>s+ +f(x),0);
const planName=m=>N(m.amount)+' '+m.freq;
const ICO={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',layers:'<path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/>',card:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',bank:'<path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>',bell:'<path d="M6 9a6 6 0 0112 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 004 0"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5M17 4.5a3.5 3.5 0 010 7M22 20c0-2.5-1.5-4-4-5"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',moon:'<path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'};
const ico=n=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICO[n]}</svg>`;
const themeBtn=()=>`<button class="ic" onclick="toggleTheme()" aria-label="Switch light or dark mode"><span class="moon">${ico('moon')}</span><span class="sun">${ico('sun')}</span></button>`;
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('ajo-theme',t)}catch(e){}}
function togglePw(){const i=$('#pw');i.type=i.type==='password'?'text':'password'}
const wa=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('0'))d='234'+d.slice(1);return d?'https://wa.me/'+d:''};
const phoneCell=p=>{const l=wa(p);return l?`<a href="${l}" target="_blank" rel="noopener">${esc(p)}</a>`:esc(p)};

/* ---- calculations: verified payments only; expected comes from each plan ---- */
function periods(freq,start,to){if(to<start)return 0;const d=(to-start)/864e5;return freq==='weekly'?Math.floor(d/7)+1:(to.getFullYear()-start.getFullYear())*12+to.getMonth()-start.getMonth()+1}
function endFor(m){let e=D(ST.contribution_cutoff);const now=new Date();if(now<e)e=now;if(m.stopped_at){const s=new Date(D(m.stopped_at)-864e5);if(s<e)e=s}return e}
const expDate=m=>periods(m.freq,D(m.start_date),endFor(m))*m.amount;
const expYear=m=>m.status==='stopped'?expDate(m):periods(m.freq,D(m.start_date),D(ST.contribution_cutoff))*m.amount;
const missed=m=>m.status==='stopped'?0:Math.max(0,expDate(m)-m.verified_total);
const tag=s=>`<span class="tag ${{verified:'ok',paid:'ok',active:'ok',pending:'warn',processing:'warn',rejected:'bad',stopped:'bad',paused:'warn'}[s]||''}">${s}</span>`;
const bar=(a,b)=>{const p=b?Math.min(100,Math.round(a/b*100)):0;return `<div class="bar"><i style="width:${p}%"></i></div><small class="mut">${p}% of ${N(b)} expected this year</small>`};

function ask(title,fields,cb){
 $('#mbox').innerHTML=`<h3>${title}</h3>`+fields.map((f,i)=>`<label>${f.l}</label><input id="mf${i}" type="${f.t||'text'}" value="${esc(f.v||'')}">`).join('')+`<div class="row"><button class="btn" id="mok">Confirm</button><button class="btn alt" id="mno">Cancel</button></div>`;
 $('#modal').style.display='flex';$('#mno').onclick=()=>$('#modal').style.display='none';
 $('#mok').onclick=()=>{const v=fields.map((f,i)=>$('#mf'+i).value.trim());if(fields.some((f,i)=>f.req!==false&&!v[i]))return alert('Please fill every field.');$('#modal').style.display='none';run(()=>cb(...v))};
}

/* ---- load ---- */
async function loadAll(){
 P=await q(sb.from('profiles').select('*').eq('id',U.id).single());
 ST=await q(sb.from('settings').select('*').eq('id',1).single());
 PLANS=await q(sb.from('plans').select('*').order('freq').order('amount'));
 MEMS=await q(sb.from('member_summary').select('*').eq('user_id',U.id).eq('cycle_year',ST.cycle_year).order('amount'));
 MYSTOPS=await q(sb.from('stop_requests').select('*').eq('user_id',U.id).eq('status','open'));
 PAYS=await q(sb.from('payments').select('*').eq('user_id',U.id).order('transfer_date',{ascending:false}));
 NOTES=await q(sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(30));
 BANK=(await q(sb.from('payout_banks').select('*').eq('user_id',U.id)))[0]||null;
 PO=(await q(sb.from('payouts').select('*').eq('user_id',U.id).eq('cycle_year',ST.cycle_year)))[0]||null;
 if(P.role==='admin'){
  ADM.members=await q(sb.from('member_summary').select('*').eq('cycle_year',ST.cycle_year).order('full_name'));
  ADM.pays=await q(sb.from('payments').select('*,profiles(full_name)').order('created_at',{ascending:false}));
  ADM.banks=await q(sb.from('payout_banks').select('*'));
  ADM.payouts=await q(sb.from('payouts').select('*').eq('cycle_year',ST.cycle_year));
  ADM.audit=await q(sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(50));
  ADM.stops=await q(sb.from('stop_requests').select('*,profiles(full_name)').eq('status','open'));
 }
}
async function refresh(){await loadAll();render()}
const go=t=>{tab=t;render()};

/* ---- auth ---- */
function authView(){
 window.READY=true;
 const j=authMode==='up';
 $('#app').innerHTML=`<div class="auth"><div class="row" style="justify-content:flex-end">${themeBtn()}</div><div class="logo" style="text-align:center;margin-bottom:12px">AJO <span>GIRLIE</span></div><div class="card"><h2>${j?'Join the savings group':'Welcome back'}</h2>
 <form onsubmit="doAuth(event)">${j?'<label>Full name</label><input name="name" required><label>Phone number</label><input name="phone" type="tel" required>':''}
 <label>Email</label><input name="email" type="email" required><label>Password</label><div class="pw"><input id="pw" name="pw" type="password" minlength="8" required><button type="button" class="ic" onclick="togglePw()" aria-label="Show or hide password">${ico('eye')}</button></div>
 <button class="btn" style="width:100%">${j?'Create account':'Sign in'}</button></form>
 <p class="mut" style="text-align:center"><a href="#" onclick="authMode='${j?'in':'up'}';authView();return false">${j?'I already have an account':'New here? Create an account'}</a></p></div></div>`;
}
function doAuth(e){e.preventDefault();const f=e.target;run(async()=>{
 if(authMode==='up'){const {data,error}=await sb.auth.signUp({email:f.email.value.trim(),password:f.pw.value,options:{data:{full_name:f.name.value.trim(),phone:f.phone.value.trim()}}});if(error)throw error;if(!data.session){alert('Account created. Please confirm your email, then sign in.');authMode='in';return authView()}}
 else{const {error}=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.pw.value});if(error)throw error}
 boot()})}
const logout=()=>sb.auth.signOut().then(()=>location.reload());

/* ---- member actions ---- */
function joinPlan(id){run(async()=>{await q(sb.rpc('join_plan',{p_plan:id}));tab='home';await refresh()})}
function submitPay(e){e.preventDefault();const f=e.target;run(async()=>{
 let path=null;const file=f.receipt.files[0];
 if(file){path=`${U.id}/${Date.now()}-${file.name.replace(/[^\w.\-]/g,'_')}`;const {error}=await sb.storage.from('receipts').upload(path,file);if(error)throw error}
 const {error}=await sb.from('payments').insert({user_id:U.id,membership_id:f.mid.value,amount:+f.amount.value,transfer_date:f.date.value,sender_name:f.sender.value.trim(),reference:f.ref.value.trim(),receipt_path:path});
 if(error)throw new Error(error.code==='23505'?'This looks like a duplicate of a payment you already submitted. It was not added.':error.message);
 tab='history';await refresh()})}
function saveBank(e){e.preventDefault();const f=e.target;run(async()=>{
 const row={user_id:U.id,account_name:f.bn.value.trim(),bank_name:f.bb.value.trim(),account_number:f.ba.value.trim()};
 if(!/^\d{10}$/.test(row.account_number))throw new Error('Account number must be 10 digits.');
 await q(sb.from('payout_banks').upsert(row));alert('Saved.');await refresh()})}
function reqStop(mid){ask('Request to stop this plan',[{l:'Reason (optional)',req:false}],async r=>{await q(sb.from('stop_requests').insert({user_id:U.id,membership_id:mid,reason:r}));alert('Request sent to the admin. Your savings stay recorded until payout day.');await refresh()})}
function saveProfile(e){e.preventDefault();const f=e.target;run(async()=>{await q(sb.from('profiles').update({full_name:f.fn.value.trim(),phone:f.ph.value.trim()}).eq('id',U.id));alert('Saved.');await refresh()})}
function claim(){if(!confirm('Make this account the owner/admin? This only works if no admin exists yet.'))return;run(async()=>{await q(sb.rpc('claim_admin'));alert('You are now the admin.');await refresh()})}
function markRead(){run(async()=>{await q(sb.from('notifications').update({is_read:true}).eq('user_id',U.id));await refresh()})}

/* ---- admin actions ---- */
const rpc=(n,a)=>run(async()=>{await q(sb.rpc(n,a));await refresh()});
const approve=id=>rpc('verify_payment',{p_id:id});
const reject=id=>ask('Reject payment',[{l:'Reason'}],r=>q(sb.rpc('reject_payment',{p_id:id,p_reason:r})).then(refresh));
function manualDlg(){
 $('#mbox').innerHTML=`<h3>Add verified contribution</h3><label>Member and plan</label><select id="x1">${ADM.members.map(m=>`<option value="${m.membership_id}">${esc(m.full_name)} · ${planName(m)}</option>`).join('')}</select><label>Amount (₦)</label><input id="x2" type="number"><label>Date</label><input id="x3" type="date"><label>Reason</label><input id="x4"><div class="row"><button class="btn" id="mok">Add</button><button class="btn alt" id="mno">Cancel</button></div>`;
 $('#modal').style.display='flex';$('#mno').onclick=()=>$('#modal').style.display='none';
 $('#mok').onclick=()=>{$('#modal').style.display='none';rpc('add_manual_payment',{p_membership:$('#x1').value,p_amount:+$('#x2').value,p_date:$('#x3').value,p_reason:$('#x4').value})}}
const correct=(id,a)=>ask('Correct amount',[{l:'New amount (₦)',t:'number',v:a},{l:'Reason'}],(n,r)=>q(sb.rpc('correct_payment',{p_id:id,p_new_amount:+n,p_reason:r})).then(refresh));
const stop=(mid,d)=>ask('Stop this plan from',[{l:'Effective date',t:'date',v:d||new Date().toISOString().slice(0,10)}],v=>q(sb.rpc('approve_stop',{p_membership:mid,p_date:v})).then(refresh));
const adjust=u=>ask('Authorised adjustment',[{l:'Amount (₦, negative reduces)',t:'number'},{l:'Reason'}],(a,r)=>q(sb.rpc('set_adjustment',{p_user:u,p_amount:+a,p_reason:r})).then(refresh));
const payStatus=u=>rpc('set_payout_status',{p_user:u,p_status:'processing'});
const markPaid=(u,due)=>ask('Mark as paid',[{l:'Amount paid (₦)',t:'number',v:due},{l:'Date paid',t:'date',v:new Date().toISOString().slice(0,10)},{l:'Transfer reference'}],(a,d,r)=>q(sb.rpc('set_payout_status',{p_user:u,p_status:'paid',p_amount:+a,p_date:d,p_ref:r})).then(refresh));
function saveSettings(e){e.preventDefault();const f=e.target;run(async()=>{
 await q(sb.from('settings').update({app_name:f.app.value,cycle_year:+f.year.value,cycle_start:f.start.value,contribution_cutoff:f.cutoff.value,payout_date:f.payout.value,bank_name:f.bank.value,account_name:f.an.value,account_number:f.ano.value,admin_phone:f.phone.value.trim(),group_link:f.group.value.trim()}).eq('id',1));alert('Settings saved.');await refresh()})}
function addPlan(e){e.preventDefault();const f=e.target;run(async()=>{await q(sb.from('plans').insert({freq:f.freq.value,amount:+f.amount.value,label:f.label.value||null}));await refresh()})}
const togglePlan=(id,on)=>run(async()=>{await q(sb.from('plans').update({is_active:!on}).eq('id',id));await refresh()});
function csv(name,rows){const t=rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name;a.click()}
const receipt=p=>run(async()=>{const {data,error}=await sb.storage.from('receipts').createSignedUrl(p,120);if(error)throw error;window.open(data.signedUrl,'_blank')});

/* ---- views ---- */
const bankBox=()=>`<div class="note"><b>Pay by bank transfer only</b><br>Bank: ${esc(ST.bank_name)}<br>Account name: ${esc(ST.account_name)}<br>Account number: ${esc(ST.account_number)}${ST.admin_phone?`<br>Phone / WhatsApp: ${esc(ST.admin_phone)}`:''}</div>`;
const groupBtn=()=>/^https:\/\//.test(ST.group_link||'')?`<a class="btn sm" href="${esc(ST.group_link)}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">Join our group chat</a>`:'';
const planRows=list=>list.map(p=>`<div class="note row" style="justify-content:space-between"><span><b>${N(p.amount)}</b> ${p.freq}${p.label?' · '+esc(p.label):''}</span><button class="btn sm" onclick="joinPlan('${p.id}')">Select</button></div>`).join('');
const availPlans=()=>PLANS.filter(p=>p.is_active&&!MEMS.some(m=>m.freq===p.freq&&+m.amount===+p.amount));
function planPicker(){return `<div class="card"><h2>Choose your savings plan</h2><p class="mut">Pick how often and how much you’ll contribute. You can add more plans later.</p>${planRows(availPlans())||'<p>No plans are available yet. Please check back soon.</p>'}</div>`}

function memberView(){
 const tv=sum(MEMS,m=>m.verified_total),tc=sum(MEMS,m=>m.verified_count),tp=sum(MEMS,m=>m.pending_count),to=sum(MEMS,missed),te=sum(MEMS,expYear);
 const pname=id=>{const m=MEMS.find(x=>x.membership_id===id);return m?planName(m):'—'};
 if(tab==='home')return `<div class="card"><h2>Welcome, ${esc((P.full_name||'').split(' ')[0])} 🌸</h2><p class="mut">Savings year ${ST.cycle_year} · Payout on ${ST.payout_date}</p>
 <div class="grid"><div class="stat"><small>Total verified savings</small><b>${N(tv)}</b></div><div class="stat"><small>Verified payments</small><b>${tc}</b></div><div class="stat"><small>Pending check</small><b>${tp}</b></div><div class="stat"><small>Outstanding</small><b>${N(to)}</b></div></div>
 <h3 style="margin-top:14px">Overall progress</h3>${bar(tv,te)}<p>Payout: ${tag(PO?.status||'awaiting')}</p><p>${groupBtn()}</p></div>
 ${MEMS.map(m=>`<div class="card"><h3>${planName(m)} ${tag(m.status)}</h3><p>Saved: <b>${N(m.verified_total)}</b> · Outstanding: ${N(missed(m))}</p>${bar(m.verified_total,expYear(m))}
 <p>${m.status==='active'?(MYSTOPS.some(r=>r.membership_id===m.membership_id)?'<span class="mut">Stop request awaiting admin approval.</span>':`<button class="btn alt sm" onclick="reqStop('${m.membership_id}')">Request to stop this plan</button>`):'<span class="note">Stopped. Your verified savings stay recorded and are paid on the payout date. Early withdrawal isn’t available.</span>'}</p></div>`).join('')}`;
 if(tab==='plans')return `<div class="card"><h2>My plans</h2>${MEMS.map(m=>`<p><b>${planName(m)}</b> ${tag(m.status)} · starts ${m.start_date}</p>`).join('')}<p class="mut">Final contribution cutoff: ${ST.contribution_cutoff}</p></div>
 <div class="card"><h3>Add another plan</h3>${planRows(availPlans())||'<p class="mut">No other plans are available.</p>'}</div>`;
 if(tab==='pay')return `<div class="card"><h2>Make a contribution</h2>${bankBox()}<div class="note">Submitting this form does <b>not</b> mean your payment has been received. It stays <i>pending verification</i> until the admin confirms it in the bank account.</div>
 <form onsubmit="submitPay(event)"><label>Which plan is this payment for?</label><select name="mid">${MEMS.filter(m=>m.status==='active').map(m=>`<option value="${m.membership_id}">${planName(m)}</option>`).join('')}</select><label>Amount transferred (₦)</label><input name="amount" type="number" min="1" required><label>Date of transfer</label><input name="date" type="date" required><label>Sender’s name</label><input name="sender" required><label>Transfer reference / narration</label><input name="ref" required><label>Receipt screenshot (optional)</label><input name="receipt" type="file" accept="image/*"><button class="btn">Submit confirmation</button></form></div>`;
 if(tab==='history')return `<div class="card"><h2>Payment history</h2><div class="tw"><table><tr><th>Date</th><th>Plan</th><th>Amount</th><th>Reference</th><th>Status</th></tr>${PAYS.map(p=>`<tr><td>${p.transfer_date}</td><td>${pname(p.membership_id)}</td><td>${N(p.amount)}</td><td>${esc(p.reference)}</td><td>${tag(p.status)} ${esc(p.reject_reason||'')}</td></tr>`).join('')||'<tr><td colspan=5>No payments yet.</td></tr>'}</table></div></div>`;
 if(tab==='payout'){const b=BANK||{};return `<div class="card"><h2>December payout</h2><p>Amount due (all plans): <b>${N(tv+(+PO?.adjustment||0))}</b> · ${tag(PO?.status||'awaiting')}${PO?.status==='paid'?` <small class="mut">Paid ${PO.paid_date}</small>`:''}</p>
 <form onsubmit="saveBank(event)"><label>Account holder name</label><input name="bn" value="${esc(b.account_name)}" required><label>Bank name</label><input name="bb" value="${esc(b.bank_name)}" required><label>Account number</label><input name="ba" value="${esc(b.account_number)}" inputmode="numeric" required><button class="btn">Save bank details</button></form></div>`}
 if(tab==='profile')return `<div class="card"><h2>My profile</h2><form onsubmit="saveProfile(event)"><label>Full name</label><input name="fn" value="${esc(P.full_name)}" required><label>Phone number</label><input name="ph" type="tel" value="${esc(P.phone)}" required><button class="btn">Save</button></form><p class="mut">The admin uses your phone number to add you to the group chat.</p></div>`;
 if(tab==='alerts')return `<div class="card"><h2>Notifications</h2><button class="btn alt sm" onclick="markRead()">Mark all read</button>${NOTES.map(n=>`<p>${n.is_read?'':'🔔 '}${esc(n.message)} <small class="mut">${new Date(n.created_at).toLocaleDateString()}</small></p>`).join('')||'<p class="mut">Nothing yet.</p>'}</div>`;
}
function adminView(){
 const A=ADM.members,tot=sum(ADM.pays.filter(p=>p.status==='verified'),p=>p.amount);
 const U2=[...new Set(A.map(m=>m.user_id))].map(id=>{const ms=A.filter(m=>m.user_id===id);return{id,name:ms[0].full_name,phone:ms[0].phone,ms,ver:sum(ms,m=>m.verified_total),out:sum(ms,missed)}});
 const po=u=>ADM.payouts.find(x=>x.user_id===u),adj=u=>+po(u)?.adjustment||0,due=x=>x.ver+adj(x.id),ps=u=>po(u)?.status||'awaiting';
 if(tab==='home')return `<div class="card"><h2>Admin dashboard</h2><div class="grid">${[['Registered members',U2.length],['Active plans',A.filter(m=>m.status==='active').length],['Stopped plans',A.filter(m=>m.status==='stopped').length],['Verified received',N(tot)],['Pending confirmations',ADM.pays.filter(p=>p.status==='pending').length],['To return '+ST.payout_date.slice(5),N(sum(U2,due))],['With outstanding',U2.filter(x=>x.out>0).length],['Paid out',U2.filter(x=>ps(x.id)==='paid').length],['Yet to be paid',U2.filter(x=>ps(x.id)!=='paid').length]].map(([a,b])=>`<div class="stat"><small>${a}</small><b>${b}</b></div>`).join('')}</div></div>
 ${ADM.stops.length?`<div class="card"><h3>Stop requests</h3>${ADM.stops.map(r=>{const m=A.find(x=>x.membership_id===r.membership_id)||A.find(x=>x.user_id===r.user_id&&x.status==='active');return `<p>${esc(r.profiles?.full_name)} ${m?'· '+planName(m):''} <small class="mut">${esc(r.reason)}</small> ${m?`<button class="btn sm" onclick="stop('${m.membership_id}')">Approve</button>`:''}</p>`}).join('')}</div>`:''}`;
 if(tab==='pay')return `<div class="card"><h2>Contributions</h2><div class="row"><select id="fm" style="width:auto" onchange="window.F=this.value;render()"><option value="">All members</option>${U2.map(x=>`<option value="${x.id}" ${window.F===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn sm" onclick="manualDlg()">+ Manual entry</button></div>
 <div class="tw"><table><tr><th>Member</th><th>Plan</th><th>Date</th><th>Amount</th><th>Reference</th><th>Status</th><th></th></tr>${ADM.pays.filter(p=>!window.F||p.user_id===window.F).map(p=>{const m=A.find(x=>x.membership_id===p.membership_id);return `<tr><td>${esc(p.profiles?.full_name)}</td><td>${m?planName(m):'—'}</td><td>${p.transfer_date}</td><td>${N(p.amount)}</td><td>${esc(p.reference)}</td><td>${tag(p.status)}</td><td>${p.status==='pending'?`<button class="btn sm grn" onclick="approve('${p.id}')">✓</button> <button class="btn sm red" onclick="reject('${p.id}')">✗</button> `:''}${p.receipt_path?`<button class="btn sm alt" onclick="receipt('${p.receipt_path}')">Receipt</button> `:''}<button class="btn sm alt" onclick="correct('${p.id}',${p.amount})">Fix</button></td></tr>`}).join('')}</table></div></div>
 <div class="card"><h3>Audit trail</h3><div class="tw"><table><tr><th>When</th><th>Action</th><th>Detail</th><th>Reason</th></tr>${ADM.audit.map(a=>`<tr><td>${new Date(a.created_at).toLocaleString()}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td><td>${esc(a.reason)}</td></tr>`).join('')}</table></div></div>`;
 if(tab==='members')return `<div class="card"><h2>Members and plans</h2><div class="tw"><table><tr><th>Name</th><th>Phone</th><th>Plan</th><th>Verified</th><th>Expected to date</th><th>Outstanding</th><th>Status</th><th></th></tr>${A.map(m=>`<tr><td>${esc(m.full_name)}</td><td>${phoneCell(m.phone)}</td><td>${planName(m)}</td><td>${N(m.verified_total)}</td><td>${N(expDate(m))}</td><td>${N(missed(m))}</td><td>${tag(m.status)}</td><td>${m.status==='active'?`<button class="btn sm alt" onclick="stop('${m.membership_id}')">Stop</button>`:''}</td></tr>`).join('')}</table></div></div>`;
 if(tab==='payout')return `<div class="card"><h2>Payout management · ${ST.payout_date}</h2><p class="mut">You make the transfers in your bank app, then record them here.</p><div class="tw"><table><tr><th>Member</th><th>Plans</th><th>Verified</th><th>Adj.</th><th>Due</th><th>Bank</th><th>Account name</th><th>Account no.</th><th>Status</th><th></th></tr>${U2.map(x=>{const b=ADM.banks.find(y=>y.user_id===x.id)||{};return `<tr><td>${esc(x.name)}</td><td>${x.ms.map(planName).join(', ')}</td><td>${N(x.ver)}</td><td>${N(adj(x.id))}</td><td><b>${N(due(x))}</b></td><td>${esc(b.bank_name||'—')}</td><td>${esc(b.account_name||'—')}</td><td>${esc(b.account_number||'—')}</td><td>${tag(ps(x.id))}</td><td><button class="btn sm alt" onclick="adjust('${x.id}')">Adjust</button> <button class="btn sm alt" onclick="payStatus('${x.id}')">Processing</button> <button class="btn sm grn" onclick="markPaid('${x.id}',${due(x)})">Paid</button></td></tr>`}).join('')}</table></div></div>`;
 if(tab==='reports'){const mo=Array(12).fill(0);ADM.pays.filter(p=>p.status==='verified'&&p.cycle_year===ST.cycle_year).forEach(p=>mo[+p.transfer_date.slice(5,7)-1]+=+p.amount);
 return `<div class="card"><h2>Reports</h2><p>Total verified: <b>${N(tot)}</b> · To return: <b>${N(sum(U2,due))}</b> · Paid out: ${U2.filter(x=>ps(x.id)==='paid').length}/${U2.length}</p><p class="mut">Verified payments only. No interest is calculated.</p>
 <div class="tw"><table><tr>${'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ').map(x=>`<th>${x}</th>`).join('')}</tr><tr>${mo.map(x=>`<td>${x?N(x):'–'}</td>`).join('')}</tr></table></div>
 <div class="row" style="margin-top:10px"><button class="btn sm" onclick="exportMembers()">Export members CSV</button><button class="btn sm" onclick="exportPays()">Export payments CSV</button><button class="btn sm" onclick="exportAudit()">Export audit trail CSV</button></div></div>`}
 if(tab==='settings'){const s=ST;return `<div class="card"><h2>Settings</h2><form onsubmit="saveSettings(event)">${[['app','App name',s.app_name],['year','Savings year',s.cycle_year,'number'],['start','Cycle start',s.cycle_start,'date'],['cutoff','Final contribution cutoff',s.contribution_cutoff,'date'],['payout','Payout date',s.payout_date,'date'],['bank','Bank',s.bank_name],['an','GTBank account name',s.account_name],['ano','GTBank account number',s.account_number],['phone','Your phone number (WhatsApp)',s.admin_phone],['group','Group invite link (WhatsApp or Telegram)',s.group_link]].map(([k,l,v,t])=>`<label>${l}</label><input name="${k}" type="${t||'text'}" value="${esc(v)}">`).join('')}<button class="btn">Save settings</button></form></div>
 <div class="card"><h3>Contribution plans</h3>${PLANS.map(p=>`<p>${N(p.amount)} ${p.freq} ${tag(p.is_active?'active':'stopped').replace('stopped','inactive')} <button class="btn sm alt" onclick="togglePlan('${p.id}',${p.is_active})">${p.is_active?'Deactivate':'Activate'}</button></p>`).join('')}
 <form class="row" onsubmit="addPlan(event)"><select name="freq" style="width:auto"><option>weekly</option><option>monthly</option></select><input name="amount" type="number" min="1" placeholder="Amount ₦" style="width:130px" required><input name="label" placeholder="Label (optional)" style="width:160px"><button class="btn sm">Add plan</button></form></div>`}
}
function exportMembers(){const A=ADM.members;const ids=[...new Set(A.map(m=>m.user_id))];csv('members-savings.csv',[['Name','Plans','Verified','Adjustment','Due','Outstanding','Payout status'],...ids.map(id=>{const ms=A.filter(m=>m.user_id===id),p=ADM.payouts.find(x=>x.user_id===id),v=sum(ms,m=>m.verified_total),a=+p?.adjustment||0;return [ms[0].full_name,ms.map(planName).join(' + '),v,a,v+a,sum(ms,missed),p?.status||'awaiting']})])}
function exportAudit(){run(async()=>{let all=[],from=0;for(;;){const r=await q(sb.from('audit_log').select('*').order('id',{ascending:false}).range(from,from+999));all=all.concat(r);if(r.length<1000)break;from+=1000}
 csv('audit-trail.csv',[['When','Action','Detail','Reason'],...all.map(a=>[new Date(a.created_at).toLocaleString(),a.action,a.detail,a.reason])])})}
function exportPays(){csv('payments.csv',[['Member','Date','Amount','Reference','Status'],...ADM.pays.map(p=>[p.profiles?.full_name,p.transfer_date,p.amount,p.reference,p.status])])}

function render(){
 window.READY=true;
 const adm=P.role==='admin';
 const tabs=adm?[['home','Home','home'],['pay','Payments','card'],['members','Members','users'],['payout','Payouts','bank'],['reports','Reports','chart'],['settings','Settings','sliders']]:[['home','Home','home'],['plans','Plans','layers'],['pay','Pay','card'],['history','History','clock'],['payout','Payout','bank'],['profile','Profile','user'],['alerts','Alerts','bell']];
 const unread=NOTES.filter(n=>!n.is_read).length;
 const body=adm?adminView():(MEMS.length?memberView():planPicker());
 $('#app').innerHTML=`<div class="top"><div class="logo">${esc(ST.app_name).replace(/ (\S+)$/,' <span>$1</span>')}</div><div class="row">${themeBtn()}<small class="mut">${esc(P.full_name)}</small><button class="btn alt sm" onclick="logout()">Sign out</button></div></div>${body}
 ${!adm?`<p style="text-align:center"><a href="#" class="mut" onclick="claim();return false" style="font-size:.75rem">I’m the owner (first-time setup)</a></p>`:''}
 ${adm||MEMS.length?`<nav>${tabs.map(([k,l,i])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${ico(i)}<span>${l}${k==='alerts'&&unread?' ('+unread+')':''}</span></button>`).join('')}</nav>`:''}`;
}
async function boot(){
 if(!sb)return;
 try{
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return authView();
  U=session.user;await loadAll();render();
 }catch(e){
  if(String(e.message).includes('coerce')){await sb.auth.signOut();return authView()}
  showErr(e.message||e);
 }
}
boot();
</script></body></html>
